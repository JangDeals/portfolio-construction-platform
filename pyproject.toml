[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-construction-platform"
version = "0.1.0"
description = "Multi-Asset Portfolio Construction, Optimization & Risk Analytics Platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]